<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tap test (locked viewport)</title>
<link rel="stylesheet" href="styles.css?v=10">
<style>
  body { padding: 1rem; font-family: system-ui, sans-serif; color: #f9fafb; background: #030712; }
  .row { margin-bottom: 2rem; }
  .count { font: 20px monospace; margin-top: 0.5rem; }
  #plain-btn {
    font-size: 1.4rem;
    padding: 1.2rem 2rem;
  }
  .keypad-grid { max-width: 10rem; }
</style>
</head>
<body>
  <h1>Tap test — locked viewport (zoom disabled)</h1>
  <p>Same test as before, but with <code>user-scalable=no, maximum-scale=1</code> on this page.</p>

  <div class="row">
    <h2>A: plain unstyled button</h2>
    <button id="plain-btn">TAP</button>
    <div class="count" id="plain-count">touchstart: 0</div>
  </div>

  <div class="row">
    <h2>B: real keypad button clone (styles.css, .key.digit)</h2>
    <div class="keypad-grid">
      <button type="button" class="key digit" id="key-btn">4</button>
    </div>
    <div class="count" id="key-count">touchstart: 0</div>
  </div>

  <p><a href="test.html" style="color:#22c55e;">&larr; Back to normal-viewport variant</a></p>

  <script>
    function wire(buttonId, countId) {
      let n = 0;
      const el = document.getElementById(countId);
      document.getElementById(buttonId).addEventListener(
        "touchstart",
        () => { n++; el.textContent = `touchstart: ${n}`; },
        { passive: true },
      );
    }
    wire("plain-btn", "plain-count");
    wire("key-btn", "key-count");
  </script>
</body>
</html>
